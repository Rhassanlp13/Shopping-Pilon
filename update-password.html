<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://xistchuskgnmjrzlntve.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhpc3RjaHVza2dubWpyemxudHZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyNDQzMzIsImV4cCI6MjA5MDgyMDMzMn0.2uQXmRgJ5lQBSMTz5keUhcj9HFhSq0t78Pcpu-CmSS4';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        window.onload = async () => {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            if (accessToken) {
                const { error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: '' });
                if (error) {
                    document.body.innerHTML = '<p>Error: enlace inválido o expirado.</p>';
                } else {
                    document.body.innerHTML = `
                        <div style="max-width:400px; margin:50px auto; font-family:sans-serif;">
                            <h2>Restablecer contraseña</h2>
                            <input type="password" id="new-password" placeholder="Nueva contraseña" style="width:100%; padding:10px; margin:10px 0;">
                            <button id="update-btn" style="padding:10px 20px;">Actualizar contraseña</button>
                            <p id="msg"></p>
                        </div>
                    `;
                    document.getElementById('update-btn').onclick = async () => {
                        const newPassword = document.getElementById('new-password').value;
                        if (newPassword.length < 6) {
                            document.getElementById('msg').innerText = 'La contraseña debe tener al menos 6 caracteres.';
                            return;
                        }
                        const { error } = await supabase.auth.updateUser({ password: newPassword });
                        if (error) {
                            document.getElementById('msg').innerText = error.message;
                        } else {
                            document.getElementById('msg').innerText = 'Contraseña actualizada. Ya puedes iniciar sesión.';
                            setTimeout(() => window.location.href = '/', 3000);
                        }
                    };
                }
            } else {
                document.body.innerHTML = '<p>Enlace no válido. Solicita un nuevo restablecimiento desde la tienda.</p>';
            }
        };
    </script>
</head>
<body></body>
</html>
