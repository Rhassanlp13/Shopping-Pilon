<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Pilón | Tienda Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a237e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pilón Shop">
    <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>

    <header class="navbar">
        <div class="logo">SHOPPING <span>PILÓN</span></div>
        <button class="cart-btn" id="cart-btn" aria-label="Ver carrito">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge" id="cart-count">0</span>
        </button>
    </header>

    <section class="hero">
        <div class="hero-content">
            <p class="hero-subtitle">Bienvenido a</p>
            <h1>Tu Mercado<br>en <em>Pilón</em></h1>
            <p class="hero-desc">Directo del vendedor a tu casa.</p>
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a href="vender.html" class="btn-primary">
                    <i class="fas fa-store"></i> Quiero vender aquí
                </a>
                <button id="btn-registro-vendedor" class="btn-secondary" style="background: #ff9800; border: none;">
                    <i class="fas fa-user-plus"></i> Crear cuenta de vendedor
                </button>
            </div>
        </div>
    </section>

    <section class="section-title">
        <h2>Productos disponibles</h2>
        <p>Toca un producto para ver los detalles</p>
    </section>

    <main class="product-grid" id="grid" aria-label="Catálogo de productos"></main>

    <div id="toast-container"></div>

    <!-- Modal carrito (sin cambios) -->
    <div id="cart-modal" class="modal-overlay" role="dialog" aria-modal="true" hidden>
        <div class="modal-box">
            <div class="modal-header">
                <h2><i class="fas fa-shopping-bag"></i> Tu Pedido</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="cart-items"></div>
            </div>
            <div class="modal-footer">
                <div class="total-row">
                    <span>Total:</span>
                    <strong>$<span id="cart-total">0</span> CUP</strong>
                </div>
                <button class="btn-whatsapp" id="btn-whatsapp">
                    <i class="fab fa-whatsapp"></i> Confirmar pedido
                </button>
                <button class="btn-clear" id="btn-clear">
                    <i class="fas fa-trash"></i> Vaciar carrito
                </button>
            </div>
        </div>
    </div>

    <!-- Modal detalle producto (sin cambios) -->
    <div id="modal-detalle" class="modal-overlay" hidden>
        ... (igual que antes) ...
    </div>

    <!-- Modal de registro de vendedor (nuevo) -->
    <div id="modal-registro" class="modal-overlay" hidden>
        <div class="modal-box" style="max-width: 400px;">
            <div class="modal-head">
                <h2><i class="fas fa-user-plus"></i> Crear cuenta de vendedor</h2>
                <button class="modal-close" id="close-registro">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="reg-email" placeholder="tucorreo@ejemplo.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="reg-confirm" placeholder="Repite la contraseña">
                </div>
                <p id="reg-error" style="color: var(--danger); font-size: 0.8rem; display: none;"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancel-registro">Cancelar</button>
                <button class="btn-primary" id="btn-registrar">Registrarse</button>
            </div>
        </div>
    </div>

    <footer class="footer"> ... (igual que antes) ... </footer>

    <script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registrado', reg))
                .catch(err => console.error('Error al registrar SW', err));
        }
    </script>
</body>
</html>
