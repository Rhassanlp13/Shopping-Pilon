<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Pedido - Shopping Pilón</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f5f5f7; margin: 0; padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 600px; width: 100%; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #1a237e; color: white; padding: 1.5rem; text-align: center; }
        .header h1 { font-family: 'Playfair Display', serif; margin: 0; font-size: 1.5rem; }
        .header p { margin: 0.5rem 0 0; opacity: 0.8; }
        .content { padding: 1.5rem; }
        .pedido-info { background: #f8f9fa; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; }
        .productos { border-top: 1px solid #e0e0e0; margin-top: 1rem; padding-top: 1rem; }
        .producto-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f0f0f0; }
        .total { font-weight: bold; font-size: 1.2rem; text-align: right; margin-top: 1rem; }
        .btn-confirmar { background: #25d366; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 1rem; transition: background 0.2s; }
        .btn-confirmar:hover { background: #128c7e; }
        .btn-confirmar:disabled { background: #ccc; cursor: not-allowed; }
        .mensaje { margin-top: 1rem; padding: 0.75rem; border-radius: 8px; text-align: center; display: none; }
        .mensaje.success { background: #d4edda; color: #155724; display: block; }
        .mensaje.error { background: #f8d7da; color: #721c24; display: block; }
        .loading { text-align: center; padding: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1><i class="fas fa-check-circle"></i> Confirmar Pedido</h1><p>Revisa los detalles y confirma para actualizar el stock</p></div>
        <div class="content">
            <div id="loading" class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando información del pedido...</div>
            <div id="pedido-info" style="display: none;"></div>
            <button id="btn-confirmar" class="btn-confirmar" style="display: none;"><i class="fas fa-check"></i> Confirmar Pedido</button>
            <div id="mensaje" class="mensaje"></div>
        </div>
    </div>
    <script type="module" src="js/confirmar.js"></script>
</body>
</html>
