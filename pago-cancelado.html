<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pago cancelado - Shopping Pilón</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .cancel-icon {
            font-size: 4rem;
            color: #e53935;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            background: #e53935;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            text-decoration: none;
            margin-top: 1.5rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="cancel-icon"><i class="fas fa-times-circle"></i></div>
        <h1>Pago cancelado</h1>
        <p>No se realizó ningún cargo. Puedes intentar nuevamente o elegir otro método de pago.</p>
        <a href="/" class="btn"><i class="fas fa-arrow-left"></i> Volver a la tienda</a>
    </div>
</body>

</html>
