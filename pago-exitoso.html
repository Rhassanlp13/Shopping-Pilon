<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago exitoso - Shopping Pilón</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 4rem;
            color: #25d366;
            margin-bottom: 1rem;
        }

        h1 {
            color: #1a237e;
            margin-bottom: 0.5rem;
        }

        .btn {
            display: inline-block;
            background: #1a237e;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            text-decoration: none;
            margin-top: 1.5rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        <h1>¡Pago exitoso!</h1>
        <p>Tu pedido ha sido registrado. El vendedor lo confirmará pronto y recibirás un enlace para seguimiento.</p>
        <a href="/" class="btn"><i class="fas fa-store"></i> Seguir comprando</a>
    </div>
    <script>
        // Limpiar el carrito del localStorage después de pago exitoso
        localStorage.removeItem('pilon_cart');
        // Opcional: notificar al vendedor (ya lo hará el webhook)
    </script>
</body>

</html>
