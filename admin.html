<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Shopping Pilón</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para admin (ya están en style.css, pero se incluyen por si acaso) */
        .shell { display: none; min-height: 100vh; }
        .shell.visible { display: grid; grid-template-columns: 220px 1fr; }
        @media (max-width: 700px) { .shell.visible { grid-template-columns: 1fr; } .sidebar { display: none; } }
    </style>
</head>
<body>
    <div class="shell" id="shell">
        <aside class="sidebar">
            <div class="sidebar-logo">SHOPPING <span>PILÓN</span><span class="sidebar-badge">Panel Admin</span></div>
            <nav>
                <div class="nav-item active" data-page="productos"><i class="fas fa-box"></i> Productos</div>
                <div class="nav-item" data-page="pedidos"><i class="fas fa-truck"></i> Pedidos</div>
                <div class="nav-item" data-page="resenas"><i class="fas fa-star"></i> Reseñas</div>
            </nav>
            <div class="sidebar-footer">
                <a href="index.html" class="btn-logout"><i class="fas fa-store"></i> Ver tienda</a>
                <button class="btn-logout" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</button>
            </div>
        </aside>
        <main class="main">
            <div class="page active" id="page-productos">
                <div class="topbar"><h1>Productos</h1><button class="btn-primary" id="btn-nuevo"><i class="fas fa-plus"></i> Nuevo producto</button></div>
                <div class="stats-grid" id="stats-productos"></div>
                <div class="table-card">
                    <div class="table-header"><h2>Catálogo completo</h2><input type="text" class="search-input" id="buscador" placeholder="Buscar producto..."></div>
                    <div id="tabla-productos"><div class="table-empty"><i class="fas fa-spinner fa-spin"></i><p>Cargando productos...</p></div></div>
                </div>
            </div>
            <div class="page" id="page-pedidos"><div class="topbar"><h1>Pedidos</h1></div><div class="table-card"><div id="tabla-pedidos"><div class="table-empty"><i class="fas fa-spinner fa-spin"></i><p>Cargando pedidos...</p></div></div></div></div>
            <div class="page" id="page-resenas"><div class="topbar"><h1>Reseñas</h1></div><div class="table-card"><div id="tabla-resenas"><div class="table-empty"><i class="fas fa-spinner fa-spin"></i><p>Cargando reseñas...</p></div></div></div></div>
        </main>
    </div>

    <!-- Modales de producto y borrar (igual que antes) -->
    <div class="modal-overlay" id="modal-producto" hidden>... (contenido igual al que tenías) ...</div>
    <div class="modal-overlay" id="modal-borrar" hidden>... (contenido igual) ...</div>
    <div id="toast-admin"></div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
